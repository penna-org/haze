name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm 可信发布（Trusted Publishing）：pnpm 用 OIDC 身份令牌换取短期 npm 令牌，并自动附带 provenance
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    if: github.repository == 'penna-org/haze'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 补齐 tag 时要找到每个版本对应的提交
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 有待发布的 changeset 时开 "Version Packages" PR；合并后发布到 npm，并创建 git tag 与 GitHub Release
      # 不使用 npm 令牌：每个包需在 npmjs.com 的 Settings → Trusted Publisher 中登记本仓库与 release.yml
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run ci:version
          publish-script: pnpm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
      # changesets 只为它发布的版本打 tag；在 CI 之外发布的版本在这里补齐 tag 与 GitHub Release
      - name: Sync git tags and GitHub releases
        run: node .github/scripts/sync-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
