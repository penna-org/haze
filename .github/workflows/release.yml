name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# 各 job 单独声明所需权限
permissions: {}

jobs:
  # 与 CI 工作流由同一次 push 触发：等同一提交的 CI 结束，成功后才开 Version PR / 发布，CI 失败时不会发布
  ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: github.repository == 'penna-org/haze'
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # CI 的运行记录可能晚于本工作流出现；重新运行 CI 后再重新运行本工作流会读取最新一次的结果
          for i in $(seq 1 110); do
            run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion,url --jq '.[0] // empty')
            if [ "$(jq -r '.status // empty' <<< "$run")" = completed ]; then
              conclusion=$(jq -r '.conclusion' <<< "$run")
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              echo "CI $conclusion: $(jq -r '.url' <<< "$run")"
              case "$conclusion" in
                success) exit 0 ;;
                # 被更新的提交取代（CI 的 concurrency 取消了旧的运行）：跳过，由新提交的 Release 处理
                cancelled) echo "::notice::CI was cancelled for $GITHUB_SHA (superseded by a newer commit); skipping the release"; exit 0 ;;
                *) echo "::error::CI did not succeed for $GITHUB_SHA ($conclusion); nothing is published"; exit 1 ;;
              esac
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the CI run of $GITHUB_SHA"
          exit 1

  release:
    name: Version or publish
    needs: ci
    runs-on: ubuntu-latest
    if: github.repository == 'penna-org/haze' && needs.ci.outputs.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
      # npm 可信发布（Trusted Publishing）：pnpm 用 OIDC 身份令牌换取短期 npm 令牌，并自动附带 provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 补齐 tag 时要找到每个版本对应的提交
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 有待发布的 changeset 时开 "Version Packages" PR；合并后发布到 npm，并创建 git tag 与 GitHub Release
      # 不使用 npm 令牌：每个包需在 npmjs.com 的 Settings → Trusted Publisher 中登记本仓库与 release.yml
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run ci:version
          publish-script: pnpm run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
      # changesets 只为它发布的版本打 tag；在 CI 之外发布的版本在这里补齐 tag 与 GitHub Release
      - name: Sync git tags and GitHub releases
        run: node .github/scripts/sync-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
