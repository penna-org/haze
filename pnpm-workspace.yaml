minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@electric-sql/pglite@0.5.12'
  - bullmq@6.5.0
  - croner@11.0.0
  - '@aws-sdk/client-s3@3.1158.0'
  - '@aws-sdk/client-sesv2@3.1158.0'
  - '@aws-sdk/lib-storage@3.1158.0'
  - '@aws-sdk/s3-request-presigner@3.1158.0'

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*
  - playground

# semver@6.3.1（经 mongodb-memory-server-core → find-cache-dir → make-dir 引入）被 trustPolicy 拦截，
# make-dir 只用到 semver.satisfies()，改用 semver 7 而不放宽安全策略
overrides:
  make-dir@3>semver: ^7.7.0

allowBuilds:
  deno: false
  esbuild: false
  msgpackr-extract: false
  workerd: false

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@aws-sdk/client-s3': ^3.1158.0
  '@aws-sdk/client-sesv2': ^3.1158.0
  '@aws-sdk/lib-storage': ^3.1158.0
  '@aws-sdk/s3-request-presigner': ^3.1158.0
  '@changesets/changelog-github': ^1.0.1
  '@changesets/cli': ^3.0.3
