<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="haze-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#3fb6e8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#haze-bg)"/>
  <!-- 日轮 -->
  <circle cx="32" cy="29" r="13" fill="#fff"/>
  <!-- 用背景渐变色的波浪把日轮切成层 -->
  <path d="M12 34c6-4 13-4 20 0s14 4 20 0" stroke="url(#haze-bg)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M12 41c6-4 13-4 20 0s14 4 20 0" stroke="url(#haze-bg)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 日轮之下的两缕雾 -->
  <path d="M16 48c5-3.6 11-3.6 16 0s11 3.6 16 0" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 54.5c3.4-2.4 6.6-2.4 10 0s6.6 2.4 10 0" stroke="#fff" stroke-opacity=".3" stroke-width="3.5" stroke-linecap="round"/>
</svg>
